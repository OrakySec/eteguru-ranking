name: Testar, gerar e publicar a imagem no GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: orakysec/eteguru-ranking-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir tipos e rodar testes
        run: |
          npm run typecheck
          npm test

      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Gerar e publicar imagem
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          # Confere se a imagem final consegue carregar as bibliotecas antes de publicar
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest node -e \
            "Promise.all([import('sharp'),import('tiktok-live-connector'),import('pg')]).then(([s])=>console.log('ok, vips',s.default.versions.vips))"
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
